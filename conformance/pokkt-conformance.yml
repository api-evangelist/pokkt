  source: https://wiki.pokkt.com/llms.txt
- id: content-signals
  name: Content Signals policy in robots.txt
  conforms: true
  evidence: >-
    https://wiki.pokkt.com/robots.txt carries "Content-Signal: ai-train=yes, search=yes,
