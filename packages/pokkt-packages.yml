generated: '2026-08-12'
method: searched
source: >-
  https://wiki.pokkt.com/downloads/native-sdk.md (POKKT developer wiki SDK downloads),
  https://registry.npmjs.org/cordova-plugin-pokkt, https://trunk.cocoapods.org/api/v1/pods/PokktSDK
note: >-
  POKKT distributes its first-party client SDKs as versioned ZIP archives from its own S3
  bucket (pokktdocumentation.s3.ap-southeast-1.amazonaws.com) rather than through language
  package registries. There is NO POKKT artifact on Maven Central (searched, 0 results), PyPI
  (404), RubyGems (404), crates.io or NuGet, so an Android integrator cannot pull the SDK as a
  Gradle coordinate. Versions below are read from the pinned download URL; `published` is the
  S3 Last-Modified header returned by an unauthenticated HEAD on that exact object.
currency_finding: >-
  Every first-party distribution channel is stale. The newest artifact POKKT actually serves is
  the v8.1.0 native SDK, last written to S3 on 2021-10-27 (Android) and 2021-10-29 (iOS) — four
  years and ten months before this probe. The npm Cordova plugin last published 2017-03-24. The
  integration guides on the wiki describe v8.2.0, a version that has no download link on the
  downloads page, so the documentation and the distribution disagree.

