method: probed
source: live unauthenticated GET of the /.well-known/ surface on every POKKT host in apis.yml
result: no-hit
note: >-
  Every /.well-known/ path was probed on all five live POKKT hosts and NOT ONE returned a real
  document, so NO WellKnown and NO SecurityTxt pointer is emitted in apis.yml. Three distinct
  failure shapes were observed and are recorded verbatim below because they are different facts:
  pokkt.com and dashboard.pokkt.com are single-page apps whose catch-all answers HTTP 200 with
  the same ~840-byte / ~470-byte HTML shell for every path (a 200 that is not a document — this
  is the classic false positive and it is scored as a MISS here); api.pokkt.com is a Spring
  reactive gateway that converts an unrouted path into HTTP 500 carrying a GraphQL-shaped error
  envelope; vdo.pokkt.com and wiki.pokkt.com return honest 404s.
  POKKT does publish one machine-readable transparency document at a fixed root path — an IAB
  Tech Lab sellers.json — but it is not a /.well-known/ resource, so it is captured under
  conformance/ instead of being credited here.

