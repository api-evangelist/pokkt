apis:
- aid: pokkt:ad-server-api
  name: POKKT Ad Server API
  description: >-
    Supply-side ad request API. A single GET to /api/AdServer returns one or more ad objects for
    a full-screen interstitial or banner placement, as a JSON array (response_format=0) or as
    HTML markup (response_format=2) with a Creative-Format header carrying NON_MRAID, MRAID1 or
    MRAID2. The response includes the interstitial creative or image URL plus POKKT-hosted
    impression and click tracker URLs the integrating partner must fire. Identity is a single
    appId query parameter issued in the POKKT dashboard; a no-fill is an empty JSON array and an
    invalid app id is a status "0" body returned with HTTP 200.
  humanURL: https://wiki.pokkt.com/api-guide/interstitial-api
  baseURL: https://vdo.pokkt.com
  tags:
  - Ad Serving
  - Interstitial
  - Banner
  - mraid
  - Mobile Advertising
  tags_raw:
  - ad-serving
  - interstitial
  - banner
  - mraid
  - mobile-advertising
