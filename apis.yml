- aid: pokkt:mobile-web-video-api
  name: POKKT Mobile Web Video API
  description: >-
    Hosted rewarded-video surface for mobile web. The publisher opens /videoWap with its appId, a
    format selector and a URL-encoded `encodedparams` bag carrying custom session data such as a
    session id or an email address, and POKKT renders the video experience. Documented over plain
    HTTP in the integration guide.
  humanURL: https://wiki.pokkt.com/api-guide/mobile-web-video-integration
  baseURL: https://vdo.pokkt.com
