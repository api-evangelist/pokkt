description: >-
  Pokkt is a mobile-first advertising and app monetization platform, part of AnyMind Group,
  serving app publishers and game developers with SDK-based ad monetization (rewarded video,
  interstitial, and video advertising) and serving advertisers with performance campaigns,
  remarketing, and connected-TV (CTV) inventory across India, Southeast Asia, and MENA. The
  platform operates through a web console for campaign management, targeting, exchange-log
  tracking, pixel-based post-click engagement, and reporting. This profile was surfaced as a
  portfolio company of 500 Global and is being enriched by the API Evangelist pipeline; no
  public OpenAPI, SDK registry package, or machine-readable API surface has been confirmed.
