name: Pokkt
description: >-
  Pokkt is a mobile-first advertising and app monetization platform, part of AnyMind Group,
  serving app publishers and game developers with SDK-based ad monetization (rewarded video,
  interstitial, and video advertising) and serving advertisers with performance campaigns,
  remarketing, and connected-TV (CTV) inventory across India, Southeast Asia, and MENA. Its
  public API surface is entirely ad-tech: a supply-side Ad Server API at vdo.pokkt.com serving
  JSON, HTML and VAST responses, a mobile-web rewarded video surface, a server-to-server
  rewarded-video gratification callback, and a demand-side OpenRTB 2.5/2.6 bid endpoint with
  global, APAC and US regional hosts. Pokkt publishes an llms.txt-indexed developer wiki and an
  IAB Tech Lab sellers.json, but no OpenAPI, no OAuth, and no public pricing; the console
  GraphQL API at api.pokkt.com is authentication-gated and its client SDKs have not been
  republished since October 2021.
