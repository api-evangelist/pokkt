  - type: Documentation
    url: https://wiki.pokkt.com/api-guide/gratification-api
  - type: Webhooks
    url: asyncapi/pokkt-webhooks.yml
  - type: Authentication
    url: authentication/pokkt-authentication.yml
- aid: pokkt:console-graphql-api
  name: POKKT Console GraphQL API
  description: >-
    The GraphQL API behind the POKKT campaign-management console, live at api.pokkt.com/graphql
    and referenced directly by the console's own JavaScript bundle. Authentication-gated: an
    anonymous introspection POST returns a 401 "Invalid authorization header format" inside a
    GraphQL errors envelope, so no SDL was captured and none was invented. No public
    documentation, credential issuance or schema reference is published for this surface.
  humanURL: https://pokkt.com/login
  baseURL: https://api.pokkt.com
  tags:
  - GraphQL
