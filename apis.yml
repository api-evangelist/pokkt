- aid: pokkt:dsp-openrtb-api
  name: POKKT DSP OpenRTB API
  description: >-
    Demand-side bidding endpoint. Exchanges POST an OpenRTB bid request object as
    application/json to /api/rtb/<appid> with an x-openrtb-version header; POKKT answers HTTP 204
    with no body for a no-bid or HTTP 200 with a bid response carrying id, adid, cid, adm, price
    and optionally crid. Video creatives are returned as VAST 2.0 inside adm. OpenRTB 2.5 and 2.6
    are supported; Audio, Native, Deal and PMP objects and VPAID are not, and only one impression
    object per request is accepted. Regional hosts are published for APAC (sg-vdo.pokkt.com) and
    the US (us-vdo.pokkt.com).
  humanURL: https://wiki.pokkt.com/dsp-integration-guide/pokkt-dsp
  baseURL: https://vdo.pokkt.com
