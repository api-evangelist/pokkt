  - type: Conventions
    url: conventions/pokkt-conventions.yml
- aid: pokkt:vast-video-api
  name: POKKT VAST Video API
  description: >-
    Video ad request API for supply-side platforms. The same /api/AdServer endpoint called with
    response_format=1 responds with a VAST XML tag rather than a JSON ad object, adding
    video-specific parameters for duration bounds (vd_min, vd_max), ECS support, viewability
    vendors and screen dimensions. VAST 2.0 is the documented response format.
  humanURL: https://wiki.pokkt.com/api-guide/vast-video-api
  baseURL: https://vdo.pokkt.com
  tags:
  - Video Advertising
