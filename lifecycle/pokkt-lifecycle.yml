generated: '2026-08-12'
method: searched
source: >-
  https://wiki.pokkt.com/ (developer wiki, page "Last Update" stamps),
  https://wiki.pokkt.com/downloads/native-sdk.md, S3 Last-Modified headers on the published SDK
  archives, and live probes of pokkt.com, blog.pokkt.com and pokktjs.pokkt.com
note: >-
  POKKT publishes no versioning policy, no deprecation policy, no SLA and no status page, so
  apis.yml carries NO StatusPage and NO Deprecation pointer — the artifact records their absence
  rather than asserting a posture the provider does not have. What the surface does carry is
  dated evidence of decay, collected below, because publication dates are the only lifecycle
  signal POKKT actually emits.

versioning:
  scheme: none
  wire_api_version: null
  note: >-
    No version path segment, header or parameter on any ad-serving endpoint. The only versioned
    things are the client SDK (semver) and the OpenRTB protocol (x-openrtb-version header).
  docs: https://wiki.pokkt.com/api-guide

deprecation:
  policy_url: null
  policy_published: false
  sunset_header: false
  deprecation_header: false
  note: >-
    No deprecation policy, no notice period, no RFC 8594 Sunset/Deprecation header support and no
    migration guide. One in-place deprecation is visible only as strikethrough text inside a
    parameter table: the connType value "1-Ethernet" is struck out in the Ad Server API
    documentation with no accompanying note.

sla:
