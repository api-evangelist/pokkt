  found: false
  probed: [status.pokkt.com, https://pokkt.com, https://wiki.pokkt.com]
  note: 'status.pokkt.com does not resolve (NXDOMAIN); no status or uptime page is linked from any documentation page.'

support:
  self_service: false
  note: >-
    Access to the DSP and the Ad Server API is mediated by an account manager ("Please reach out
    to your account manager for App ID details"). The published contact address is
    monetization@pokkt.com, read from the contact_email field of https://pokkt.com/sellers.json.
    The documentation site's only feedback channel is a GitHub issue template on
    github.com/AnyMindGroup/pokkt-gitbook-user-manual.

