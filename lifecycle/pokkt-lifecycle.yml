decay_observed:
- host: pokktjs.pokkt.com
  finding: expired TLS certificate
  evidence: >-
    GET https://pokktjs.pokkt.com/interstitial/pokkt.js fails TLS verification with
    "certificate has expired" (curl exit 60). The file is served fine over plain HTTP and over
    HTTPS with verification disabled (200, 5,429 bytes), so the script is live but unloadable by
    any modern browser from an HTTPS page — this is the loader the Ad Tag integration guide tells
    publishers to embed.
  method: probed
  date: '2026-08-12'
- host: blog.pokkt.com
  finding: unreachable
  evidence: 'DNS resolves to an EC2 host in ap-southeast-1 but TCP connections time out (curl exit 28, 25s).'
  method: probed
  date: '2026-08-12'
- host: pokkt.com
  finding: marketing site replaced by the console
  evidence: >-
    The document root now serves the POKKT console single-page app (title "POKKT | Monetization |
    Advertising | Remarketing | Video", routes /login, /logout, /graphql, /not-found), sharing
    its stylesheet bundle with console-alpha.pokkt.com. Every marketing path — /privacy,
    /careers, /pricing — returns the same 843-byte shell, so the public product, pricing and
    legal pages the documentation links to no longer exist.
  method: probed
